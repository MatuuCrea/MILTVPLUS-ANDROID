name: Android Release Build & Sign

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Release notes or version tag'
        required: false
        default: 'v1.11.95'

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      if: env.ANDROID_KEYSTORE_BASE64 != ''
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/miltvplus-release.jks
        fi

    - name: Create keystore.properties
      if: env.ANDROID_KEYSTORE_PASSWORD != ''
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
          echo "storeFile=miltvplus-release.jks" > keystore.properties
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> keystore.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> keystore.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> keystore.properties
        fi

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Build Release APK & AAB
      run: |
        ./gradlew :app:assembleRelease
        ./gradlew :app:bundleRelease

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Release AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/app-release.aab
