name: Android Release Build & Sign

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Release notes or version tag'
        required: false
        default: 'v1.11.95'

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Secrets Presence
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        missing=0
        if [ -z "$KEYSTORE_B64" ]; then echo "Missing secret: ANDROID_KEYSTORE_BASE64"; missing=1; fi
        if [ -z "$KEYSTORE_PASS" ]; then echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; missing=1; fi
        if [ -z "$KEY_ALIAS" ]; then echo "Missing secret: ANDROID_KEY_ALIAS"; missing=1; fi
        if [ -z "$KEY_PASS" ]; then echo "Missing secret: ANDROID_KEY_PASSWORD"; missing=1; fi
        if [ $missing -eq 1 ]; then
          echo "Error: One or more required signing secrets are missing in GitHub repository secrets."
          exit 1
        fi

    - name: Decode Keystore to Root Directory
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > miltvplus-release.jks
        if [ ! -s miltvplus-release.jks ]; then
          echo "Error: Decoded keystore is empty or missing."
          exit 1
        fi

    - name: Create keystore.properties
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        echo "storeFile=miltvplus-release.jks" > keystore.properties
        echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> keystore.properties
        echo "keyAlias=$ANDROID_KEY_ALIAS" >> keystore.properties
        echo "keyPassword=$ANDROID_KEY_PASSWORD" >> keystore.properties

    - name: Verify Keystore with Keytool
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        keytool -list -v -keystore miltvplus-release.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD"

    - name: Run unit tests
      run: ./gradlew :app:testDebugUnitTest

    - name: Build Release APK & AAB
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: |
        ./gradlew :app:assembleRelease -PTMDB_API_KEY="${TMDB_API_KEY}"
        ./gradlew :app:bundleRelease -PTMDB_API_KEY="${TMDB_API_KEY}"

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload Release AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/app-release.aab
